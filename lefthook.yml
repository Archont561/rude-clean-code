# Hooks delegate to the locked doit automation tasks used locally and in CI.
pre-commit:
  jobs:
    - name: pre-commit-checks
      run: pixi run --locked doit pre-commit

commit-msg:
  jobs:
    - name: conventional-commit
      run: pixi run --locked doit lint-commit < {1}

pre-push:
  jobs:
    - name: tests
      run: pixi run --locked doit test
