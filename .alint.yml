# yaml-language-server: $schema=https://alint.org/_alint/configuration/schema.json
version: 1

rules:
  - id: require-pixi-manifest
    kind: file_exists
    paths: pixi.toml
    level: error
    message: Required pixi.toml is missing.
  - id: require-pixi-lock
    kind: file_exists
    paths: pixi.lock
    level: error
    message: Required pixi.lock is missing.
  - id: require-sandbox-config
    kind: file_exists
    paths: pixi-sandbox.toml
    level: error
    message: Required pixi-sandbox.toml is missing.
  - id: require-sandbox-workflow
    kind: file_exists
    paths: .github/workflows/pixi-sandbox.yml
    level: error
    message: Sandbox publishing workflow is missing.
  - id: require-sandbox-restore
    kind: file_exists
    paths: scripts/restore.sh
    level: error
    message: Required scripts/restore.sh is missing.
  - id: scripts-only-restore-file
    kind: file_absent
    paths:
      - 'scripts/**'
      - '!scripts/restore.sh'
    level: error
    message: Only scripts/restore.sh may exist under scripts/.
  - id: scripts-dir-only-restore
    kind: dir_only_contains
    select: scripts
    allow:
      - restore.sh
    level: error
    message: Directory scripts/ may only contain restore.sh.
  - id: scripts-no-subdirs
    kind: dir_absent
    paths: 'scripts/*'
    level: error
    message: Subdirectories are not allowed under scripts/.
  - id: require-dodo-file
    kind: file_exists
    paths: automation/dodo.py
    level: error
    message: Required automation/dodo.py task file is missing.
  - id: automation-subdirs-exist
    kind: dir_exists
    paths:
      - automation/lib
      - automation/features
      - automation/tests
    level: error
    message: automation/ must contain tests/, features/, and lib/ directories.
  - id: automation-only-dodo-file
    kind: dir_only_contains
    select: automation
    allow:
      - dodo.py
    level: error
    message: automation/ top level may only contain dodo.py alongside tests/, features/, and lib/.
  - id: automation-no-extra-subdirs
    kind: dir_absent
    paths:
      - 'automation/*'
      - '!automation/lib'
      - '!automation/features'
      - '!automation/tests'
    level: error
    message: 'Unexpected subdirectory under automation/ (allowed: tests/, features/, lib/).'
  - id: automation-lib-has-python
    kind: dir_contains
    select: automation/lib
    require:
      - activate.py
      - '*.py'
    level: error
    message: automation/lib/ must contain Python modules including activate.py.
  - id: automation-lib-python-only
    kind: dir_only_contains
    select: automation/lib
    allow:
      - '*.py'
    level: error
    message: automation/lib/ may only contain Python modules.
  - id: automation-features-has-gherkin
    kind: dir_contains
    select: automation/features
    require:
      - '*.feature'
    level: error
    message: automation/features/ must contain .feature files.
  - id: automation-features-only
    kind: dir_only_contains
    select: automation/features
    allow:
      - '*.feature'
    level: error
    message: automation/features/ may only contain .feature files.
  - id: automation-tests-has-tests
    kind: dir_contains
    select: automation/tests
    require:
      - 'test_*.py'
    level: error
    message: automation/tests/ must contain test_*.py files.
  - id: automation-tests-only
    kind: dir_only_contains
    select: automation/tests
    allow:
      - conftest.py
      - 'test_*.py'
    level: error
    message: automation/tests/ may only contain conftest.py and test_*.py files.
  - id: automation-dodo-imports-lib
    kind: file_content_matches
    paths: automation/dodo.py
    pattern: '(?m)^from (?:automation\.)?lib[.\s]'
    level: error
    message: automation/dodo.py must import task helpers from automation/lib/.
  - id: automation-tests-exercise-lib
    kind: file_content_matches
    paths: 'automation/tests/test_*.py'
    pattern: '(?:automation\.)?lib\b'
    level: error
    message: Tests in automation/tests/ must import or exercise automation/lib/.
  - id: pixi-tools-runs-doit
    kind: toml_path_equals
    paths: pixi.toml
    path: $.tasks.tools
    equals: doit
    level: error
    message: pixi.toml must define [tasks] tools = "doit" so `pixi run tools <cmd>` invokes doit.
  - id: pixi-activation-uses-automation-lib
    kind: toml_path_matches
    paths: pixi.toml
    path: $.activation.env.PYTHONPATH
    matches: 'automation/lib/activate\.py'
    level: error
    message: pixi.toml activation PYTHONPATH must invoke automation/lib/activate.py.
  - id: require-doit-config
    kind: file_exists
    paths: doit.cfg
    level: error
    message: Required doit.cfg task configuration is missing.
  - id: require-package-manifest
    kind: file_exists
    paths: rude-clean-code/pyproject.toml
    level: error
    message: Rude Clean Code package manifest is missing.
  - id: require-hooks
    kind: file_exists
    paths: lefthook.yml
    level: error
    message: Required lefthook.yml is missing.
  - id: require-ruff-config
    kind: file_exists
    paths: ruff.toml
    level: error
    message: Required ruff.toml is missing.
  - id: require-bun-manifest
    kind: file_exists
    paths: package.json
    level: error
    message: Developer tooling manifest is missing.
  - id: require-bun-lock
    kind: file_exists
    paths: bun.lock
    level: error
    message: Bun lockfile is missing.
  - id: require-skills-lock
    kind: file_exists
    paths: skills-lock.json
    level: error
    message: Skills lockfile is missing.
  - id: require-convco-config
    kind: file_exists
    paths: .versionrc
    level: error
    message: Convco configuration is missing.
  - id: require-codecov-config
    kind: file_exists
    paths: codecov.yml
    level: error
    message: Codecov configuration is missing.
  - id: require-vale-config
    kind: file_exists
    paths: .vale.ini
    level: error
    message: Required Vale configuration is missing.
  - id: require-markdownlint-config
    kind: file_exists
    paths: .markdownlint-cli2.jsonc
    level: error
    message: markdownlint-cli2 configuration is missing.
  - id: require-docs-index
    kind: file_exists
    paths: docs/README.md
    level: error
    message: Documentation index docs/README.md is missing.
  - id: require-docs-guides
    kind: file_exists
    paths: docs/guides/development-setup.md
    level: error
    message: Required docs/guides/development-setup.md is missing.
  - id: require-docs-checks-guide
    kind: file_exists
    paths: docs/guides/running-the-checks.md
    level: error
    message: Required docs/guides/running-the-checks.md is missing.
  - id: require-docs-concepts
    kind: file_exists
    paths: docs/concepts/version-only-scaffold.md
    level: error
    message: Required docs/concepts/version-only-scaffold.md is missing.
  - id: require-docs-reference-tasks
    kind: file_exists
    paths: docs/reference/pixi-tasks.md
    level: error
    message: Required docs/reference/pixi-tasks.md is missing.
  - id: require-docs-reference-layout
    kind: file_exists
    paths: docs/reference/repository-layout.md
    level: error
    message: Required docs/reference/repository-layout.md is missing.
  - id: require-docs-architecture
    kind: file_exists
    paths: docs/architecture/overview.md
    level: error
    message: Required docs/architecture/overview.md is missing.
  - id: require-docs-documentation-standard
    kind: file_exists
    paths: docs/development/documentation.md
    level: error
    message: Required docs/development/documentation.md is missing.
  - id: require-dependabot-config
    kind: file_exists
    paths: .github/dependabot.yml
    level: error
    message: Dependabot configuration is missing.
  - id: dependabot-matches-schema
    kind: json_schema_passes
    paths: .github/dependabot.yml
    schema_path: .alint/schemas/dependabot.schema.json
    level: error
    message: dependabot.yml does not satisfy the repository Dependabot policy schema.
  - id: require-issue-bug-template
    kind: file_exists
    paths: .github/ISSUE_TEMPLATE/bug_report.yml
    level: error
    message: Bug report issue form is missing.
  - id: require-issue-feature-template
    kind: file_exists
    paths: .github/ISSUE_TEMPLATE/feature_request.yml
    level: error
    message: Feature request issue form is missing.
  - id: require-issue-config
    kind: file_exists
    paths: .github/ISSUE_TEMPLATE/config.yml
    level: error
    message: Issue template configuration (.github/ISSUE_TEMPLATE/config.yml) is missing.
  - id: issue-config-disables-blank-issues
    kind: yaml_path_equals
    paths: .github/ISSUE_TEMPLATE/config.yml
    path: $.blank_issues_enabled
    equals: false
    level: error
    message: Blank issues must be disabled so reports flow through the forms.
  - id: bug-template-valid-body-types
    kind: yaml_path_matches
    paths: .github/ISSUE_TEMPLATE/bug_report.yml
    path: $.body[*]['type']
    matches: '^(markdown|input|textarea|dropdown|checkboxes)$'
    level: error
    message: bug_report.yml declares an unknown issue form body type.
  - id: feature-template-valid-body-types
    kind: yaml_path_matches
    paths: .github/ISSUE_TEMPLATE/feature_request.yml
    path: $.body[*]['type']
    matches: '^(markdown|input|textarea|dropdown|checkboxes)$'
    level: error
    message: feature_request.yml declares an unknown issue form body type.
  - id: require-pull-request-template
    kind: file_exists
    paths: .github/PULL_REQUEST_TEMPLATE.md
    level: error
    message: Pull request template is missing.
  - id: workflow-run-steps-single-line
    kind: yaml_path_matches
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/release.yml
    path: $.jobs[*].steps[*].run
    matches: '^[^\n]+$'
    level: error
    message: Workflow run steps must be a single line — move logic into automation/dodo.py (or scripts/restore.sh for pre-Pixi bootstrap) and call it instead.
  - id: require-release-workflow
    kind: file_exists
    paths: .github/workflows/release.yml
    level: error
    message: Release workflow is missing.
