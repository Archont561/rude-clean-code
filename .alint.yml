# yaml-language-server: $schema=https://alint.org/_alint/configuration/schema.json
version: 1

rules:
  - id: require-pixi-manifest
    kind: file_exists
    paths: pixi.toml
    level: error
    message: Required pixi.toml is missing.
  - id: require-pixi-lock
    kind: file_exists
    paths: pixi.lock
    level: error
    message: Required pixi.lock is missing.
  - id: require-sandbox-config
    kind: file_exists
    paths: pixi-sandbox.toml
    level: error
    message: Required pixi-sandbox.toml is missing.
  - id: require-sandbox-workflow
    kind: file_exists
    paths: .github/workflows/pixi-sandbox.yml
    level: error
    message: Sandbox publishing workflow is missing.
  - id: require-sandbox-restore
    kind: file_exists
    paths: scripts/restore.sh
    level: error
    message: Required scripts/restore.sh is missing.
  - id: require-package-manifest
    kind: file_exists
    paths: packages/rude-clean-code/pyproject.toml
    level: error
    message: Rude Clean Code package manifest is missing.
  - id: require-hooks
    kind: file_exists
    paths: lefthook.yml
    level: error
    message: Required lefthook.yml is missing.
  - id: require-ruff-config
    kind: file_exists
    paths: ruff.toml
    level: error
    message: Required ruff.toml is missing.
  - id: require-bun-manifest
    kind: file_exists
    paths: package.json
    level: error
    message: Developer tooling manifest is missing.
  - id: require-bun-lock
    kind: file_exists
    paths: bun.lock
    level: error
    message: Bun lockfile is missing.
  - id: require-skills-lock
    kind: file_exists
    paths: skills-lock.json
    level: error
    message: Skills lockfile is missing.
  - id: require-convco-config
    kind: file_exists
    paths: .versionrc
    level: error
    message: Convco configuration is missing.
  - id: require-codecov-config
    kind: file_exists
    paths: codecov.yml
    level: error
    message: Codecov configuration is missing.
  - id: require-vale-config
    kind: file_exists
    paths: .vale.ini
    level: error
    message: Required Vale configuration is missing.
  - id: require-markdownlint-config
    kind: file_exists
    paths: .markdownlint-cli2.jsonc
    level: error
    message: markdownlint-cli2 configuration is missing.
  - id: require-docs-index
    kind: file_exists
    paths: docs/README.md
    level: error
    message: Documentation index docs/README.md is missing.
  - id: require-docs-guides
    kind: file_exists
    paths: docs/guides/development-setup.md
    level: error
    message: Required docs/guides/development-setup.md is missing.
  - id: require-docs-checks-guide
    kind: file_exists
    paths: docs/guides/running-the-checks.md
    level: error
    message: Required docs/guides/running-the-checks.md is missing.
  - id: require-docs-concepts
    kind: file_exists
    paths: docs/concepts/version-only-scaffold.md
    level: error
    message: Required docs/concepts/version-only-scaffold.md is missing.
  - id: require-docs-reference-tasks
    kind: file_exists
    paths: docs/reference/pixi-tasks.md
    level: error
    message: Required docs/reference/pixi-tasks.md is missing.
  - id: require-docs-reference-layout
    kind: file_exists
    paths: docs/reference/repository-layout.md
    level: error
    message: Required docs/reference/repository-layout.md is missing.
  - id: require-docs-architecture
    kind: file_exists
    paths: docs/architecture/overview.md
    level: error
    message: Required docs/architecture/overview.md is missing.
  - id: require-docs-documentation-standard
    kind: file_exists
    paths: docs/development/documentation.md
    level: error
    message: Required docs/development/documentation.md is missing.
  - id: require-dependabot-config
    kind: file_exists
    paths: .github/dependabot.yml
    level: error
    message: Dependabot configuration is missing.
  - id: dependabot-matches-schema
    kind: json_schema_passes
    paths: .github/dependabot.yml
    schema_path: .alint/schemas/dependabot.schema.json
    level: error
    message: dependabot.yml does not satisfy the repository Dependabot policy schema.
  - id: require-issue-bug-template
    kind: file_exists
    paths: .github/ISSUE_TEMPLATE/bug_report.yml
    level: error
    message: Bug report issue form is missing.
  - id: require-issue-feature-template
    kind: file_exists
    paths: .github/ISSUE_TEMPLATE/feature_request.yml
    level: error
    message: Feature request issue form is missing.
  - id: require-issue-config
    kind: file_exists
    paths: .github/ISSUE_TEMPLATE/config.yml
    level: error
    message: Issue template configuration (.github/ISSUE_TEMPLATE/config.yml) is missing.
  - id: issue-config-disables-blank-issues
    kind: yaml_path_equals
    paths: .github/ISSUE_TEMPLATE/config.yml
    path: $.blank_issues_enabled
    equals: false
    level: error
    message: Blank issues must be disabled so reports flow through the forms.
  - id: bug-template-valid-body-types
    kind: yaml_path_matches
    paths: .github/ISSUE_TEMPLATE/bug_report.yml
    path: $.body[*]['type']
    matches: '^(markdown|input|textarea|dropdown|checkboxes)$'
    level: error
    message: bug_report.yml declares an unknown issue form body type.
  - id: feature-template-valid-body-types
    kind: yaml_path_matches
    paths: .github/ISSUE_TEMPLATE/feature_request.yml
    path: $.body[*]['type']
    matches: '^(markdown|input|textarea|dropdown|checkboxes)$'
    level: error
    message: feature_request.yml declares an unknown issue form body type.
  - id: require-pull-request-template
    kind: file_exists
    paths: .github/PULL_REQUEST_TEMPLATE.md
    level: error
    message: Pull request template is missing.
