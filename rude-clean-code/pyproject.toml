[build-system]
requires = ["hatchling>=1.27,<1.30"]
build-backend = "hatchling.build"

[project]
name = "rude-clean-code"
version = "0.3.0"
description = "Clean Code plugin for the Rude Python linter."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Archont561" }]
keywords = ["rude", "linter", "clean-code", "solid", "static-analysis", "code-quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "rude>=0.1a4,<0.2",
]

[project.entry-points."rude.plugins"]
rude_clean_code = "rude_clean_code.plugin"

[project.urls]
Homepage = "https://github.com/Archont561/rude-clean-code#readme"
Documentation = "https://github.com/Archont561/rude-clean-code/blob/main/docs/README.md"
Repository = "https://github.com/Archont561/rude-clean-code"
Issues = "https://github.com/Archont561/rude-clean-code/issues"
Changelog = "https://github.com/Archont561/rude-clean-code/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/rude_clean_code"]

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
  "tests/**",
  "features/**",
  "/README.md",
  "/LICENSE",
]

[tool.rude]
select = ["CC0", "CC1", "CC2", "CC3", "CC4", "CC5", "CC6", "CC7", "CC9"]
# Exclude rules that emit expected idiom noise on test fixtures / AST visitors:
# - CC108: shared pytest-bdd step fixture signatures and uniform option helpers
# - CC403: repeated rule option keys and test assertion literals
# - CC601: compact AST node-type dispatch checks in rule visitors
ignore = [
  "CC108",
  "CC403",
  "CC601",
]

[tool.rude.rules.CC002]
allowed_names = ["VERSION"]

[tool.rude.rules.CC906]
require_reason_for = ["CC"]

# Prevent plugin source from instantiating Rude's Linter directly:
[tool.rude.rules.CC702]
concrete_classes = ["Linter"]
only_paths = ["rude-clean-code/src/"]

# Enforce decision-2 (lazy VERSION-only root __init__), internal module layering,
# and strict isolation between rude-clean-code/, automation/, and tests:
[[tool.rude.rules.CC704.forbidden]]
from_paths = ["src/rude_clean_code/__init__.py"]
forbidden_modules = ["rude", "rude_clean_code"]

[[tool.rude.rules.CC704.forbidden]]
from_paths = ["src/rude_clean_code/_scope.py"]
forbidden_modules = ["rude_clean_code.rules", "rude_clean_code.plugin"]

[[tool.rude.rules.CC704.forbidden]]
from_paths = ["src/rude_clean_code/rules/_*.py"]
forbidden_modules = [
  "rude_clean_code.plugin",
  "rude_clean_code.rules.class_heuristics",
  "rude_clean_code.rules.classes",
  "rude_clean_code.rules.comments",
  "rude_clean_code.rules.complexity",
  "rude_clean_code.rules.complexity_heuristics",
  "rude_clean_code.rules.coupling_heuristics",
  "rude_clean_code.rules.dependencies",
  "rude_clean_code.rules.documentation",
  "rude_clean_code.rules.dry",
  "rude_clean_code.rules.dry_heuristics",
  "rude_clean_code.rules.errors",
  "rude_clean_code.rules.function_heuristics",
  "rude_clean_code.rules.functions",
  "rude_clean_code.rules.heuristics",
  "rude_clean_code.rules.modules",
  "rude_clean_code.rules.naming",
  "rude_clean_code.rules.patterns",
  "rude_clean_code.rules.solid_heuristics",
]

[[tool.rude.rules.CC704.forbidden]]
from_paths = ["src/rude_clean_code/rules/"]
forbidden_modules = ["rude_clean_code.plugin"]

[[tool.rude.rules.CC704.forbidden]]
from_paths = ["rude-clean-code/src/"]
forbidden_modules = ["automation", "doit", "pytest"]

[[tool.rude.rules.CC704.forbidden]]
from_paths = ["automation/lib/"]
forbidden_modules = ["automation.dodo", "doit", "pytest", "rude_clean_code"]

[[tool.rude.rules.CC704.forbidden]]
from_paths = ["automation/dodo.py"]
forbidden_modules = ["automation.tests", "pytest"]

[[tool.rude.rules.CC704.forbidden]]
from_paths = ["automation/"]
forbidden_modules = ["rude_clean_code"]
