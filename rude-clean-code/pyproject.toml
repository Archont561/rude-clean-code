[build-system]
requires = ["hatchling>=1.27,<1.30"]
build-backend = "hatchling.build"

[project]
name = "rude-clean-code"
version = "0.1.0"
description = "Clean Code plugin for the Rude Python linter."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Archont561" }]
keywords = ["rude", "linter", "clean-code", "solid", "static-analysis", "code-quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "rude>=0.1a4,<0.2",
]

[project.entry-points."rude.plugins"]
rude_clean_code = "rude_clean_code.plugin"

[project.urls]
Homepage = "https://github.com/Archont561/rude-clean-code#readme"
Documentation = "https://github.com/Archont561/rude-clean-code/blob/main/docs/README.md"
Repository = "https://github.com/Archont561/rude-clean-code"
Issues = "https://github.com/Archont561/rude-clean-code/issues"
Changelog = "https://github.com/Archont561/rude-clean-code/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/rude_clean_code"]

[tool.hatch.build.targets.sdist]
include = [
  "src/**",
  "tests/**",
  "features/**",
  "/README.md",
  "/LICENSE",
]

[tool.rude]
select = ["CC1", "CC2", "CC3"]
