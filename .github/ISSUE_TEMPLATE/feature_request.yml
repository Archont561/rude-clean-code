name: Feature Request
description: Suggest an enhancement — a new rule, tooling, or documentation improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. 34 Clean Code rules (`CC001`–`CC805`) are
        implemented; remaining rule families in the catalogue are planned.
        Rule proposals are most likely to advance if they reference the product
        specification in `backlog/docs/doc-1` and the proposed catalogue in
        `backlog/docs/doc-2`.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What pain or gap does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change? For rule ideas, sketch the detection contract and false-positive notes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: willingness
    attributes:
      label: Would you like to work on this?
      options:
        - "Yes, I can submit a PR"
        - "I can test or review"
        - "No"
    validations:
      required: false
