# Temporary: regenerate pixi.lock on a networked runner (conda-forge is not
# reachable from the authoring sandbox). Commits the lockfile back to this
# branch. Removed once the lockfile update lands.
name: Bootstrap pixi.lock

on:
  push:
    branches: [arena/e2fe3e61-rude-clean-code]
    paths:
      - .github/workflows/bootstrap-pixi-lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-pixi-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    name: Regenerate and commit pixi.lock
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.83.0
          run-install: false
          cache: false
      - run: pixi lock
      - name: Commit pixi.lock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pixi.lock
          if git diff --cached --quiet; then
            echo "pixi.lock already up to date"
            exit 0
          fi
          git commit -m "chore: add alint to the locked workspace" -m "Add alint to the pypi dependencies so the alint policy task has a binary in the locked environment; regenerate pixi.lock with pixi v0.83.0."
          git push origin HEAD:arena/e2fe3e61-rude-clean-code
