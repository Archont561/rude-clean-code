name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Package tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.83.0
          locked: true
          cache: true
      - run: pixi run --locked coverage

  policy:
    name: Policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.83.0
          locked: true
          cache: true
      - run: pixi run --locked lint
      - run: pixi run --locked format-check
      - run: pixi run --locked typecheck
      - run: pixi run --locked check-packages
      - run: pixi run --locked lint-prose
      - run: pixi run --locked alint
      - run: pixi run --locked actionlint
      - name: Check every incoming commit message
        if: github.event_name != 'workflow_dispatch'
        # The script derives a base from the repository when the event
        # base is empty or the zero SHA (first push, branch creation).
        run: pixi run --locked scripts/check-commit-messages.sh
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

  compat:
    name: Python compatibility
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: '3.11', toxenv: py311 }
          - { python: '3.12', toxenv: py312 }
          - { python: '3.13', toxenv: py313 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.83.0
          locked: true
          cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # tox discovers interpreters on PATH; setup-python guarantees the
          # interpreter matching this leg of the matrix.
          python-version: ${{ matrix.python }}
      - run: pixi run --locked tox -e ${{ matrix.toxenv }}

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.83.0
          locked: true
          cache: true
      - run: pixi run --locked docs-lint
      # Backlog records (backlog/**) are immutable and vendored skills
      # (.agents/**) are owned upstream, so both are excluded from the link
      # check; the maintained documentation surface is what this job gates.
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-retries 3 --retry-wait-time 2 'README.md' 'AGENTS.md' 'CONTRIBUTING.md' 'CHANGELOG.md' '.github/PULL_REQUEST_TEMPLATE.md' 'docs/**/*.md'
        env:
          GITHUB_TOKEN: ${{ github.token }}
