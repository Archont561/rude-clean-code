name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Package tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.83.0
          locked: true
          cache: true
      - run: pixi run --locked coverage

  policy:
    name: Policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.83.0
          locked: true
          cache: true
      - run: pixi run --locked lint
      - run: pixi run --locked format-check
      - run: pixi run --locked typecheck
      - run: pixi run --locked check-packages
      - run: pixi run --locked lint-prose
      - run: pixi run --locked alint
      - run: pixi run --locked actionlint
      - name: Check every incoming commit message
        if: github.event_name != 'workflow_dispatch'
        # A zero or unresolvable event base (first push, branch creation)
        # must not fail the job: derive a base from the repository, and
        # skip cleanly if no valid range can be formed.
        run: |
          set -eu
          head="${COMMIT_HEAD}"
          base="${COMMIT_BASE}"
          zero="0000000000000000000000000000000000000000"
          if [ -z "${base}" ] || [ "${base}" = "${zero}" ]; then
            if git cat-file -e "HEAD^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD^)"
            else
              base="$(git rev-list --max-parents=0 HEAD | head -n 1)"
            fi
          fi
          if [ -z "${head}" ] || ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
            echo "No valid head ('${head:-empty}'); skipping commit-message check."
            exit 0
          fi
          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No valid base ref available (event base: '${COMMIT_BASE:-empty}'); skipping commit-message check."
            exit 0
          fi
          echo "Checking commits ${base}..${head}"
          pixi run --locked -x convco check "${base}..${head}"
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.83.0
          locked: true
          cache: true
      - run: pixi run --locked docs-lint
      # Backlog records (backlog/**) are immutable and vendored skills
      # (.agents/**) are owned upstream, so both are excluded from the link
      # check; the maintained documentation surface is what this job gates.
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-retries 3 --retry-wait-time 2 'README.md' 'AGENTS.md' 'CONTRIBUTING.md' 'CHANGELOG.md' '.github/PULL_REQUEST_TEMPLATE.md' 'docs/**/*.md' 'packages/*/README.md'
        env:
          GITHUB_TOKEN: ${{ github.token }}
