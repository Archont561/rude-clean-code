# Based on the release-pinned publisher in Archont561/universe.
# Publishes the locked development tooling environment.
name: Publish developer sandbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pixi.toml'
      - 'pixi.lock'
      - 'pixi-sandbox.toml'
      - '.github/workflows/pixi-sandbox.yml'

permissions:
  contents: read

concurrency:
  group: pixi-sandbox-developer-${{ github.repository }}
  cancel-in-progress: false

env:
  PIXI_SANDBOX_VERSION: '0.9.0'

jobs:
  publish:
    name: Pack, verify, and publish developer linux-64
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.84.1
          run-install: false
          cache: false
      - name: Fetch and verify the pinned pixi-sandbox release
        shell: bash
        env:
          PIXI_SANDBOX_BIN: ${{ runner.temp }}/pixi-sandbox-bin/pixi-sandbox
        run: |
          set -euo pipefail
          asset=pixi-sandbox-x86_64-unknown-linux-musl
          base="https://github.com/Archont561/pixi-sandbox/releases/download/v${PIXI_SANDBOX_VERSION}"
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --output "$stage/$asset" "$base/$asset"
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --output "$stage/SHA256SUMS" "$base/SHA256SUMS"
          digest="$(awk -v name="$asset" '{ sub(/\r$/, ""); if ($2 == name || $2 == "*" name) { if (NF == 2) print $1; else print "invalid" } }' "$stage/SHA256SUMS")"
          [[ "$digest" =~ ^[[:xdigit:]]{64}$ ]] || { echo "invalid or ambiguous checksum for $asset" >&2; exit 1; }
          printf '%s  %s\n' "$digest" "$asset" > "$stage/selected.sha256"
          (cd "$stage" && sha256sum --check selected.sha256)
          chmod +x "$stage/$asset"
          mkdir -p "$(dirname "$PIXI_SANDBOX_BIN")"
          mv "$stage/$asset" "$PIXI_SANDBOX_BIN"
      - name: Pack, verify, and publish
        shell: bash
        env:
          PIXI_SANDBOX_BIN: ${{ runner.temp }}/pixi-sandbox-bin/pixi-sandbox
          PIXI_SANDBOX_PUSH_TOKEN: ${{ github.token }}
          REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
        run: >-
          "$PIXI_SANDBOX_BIN" pipeline
          --envs default
          --platform linux-64
          --branch sandbox/developer-linux-64
          --remote "$REMOTE"
          --config pixi-sandbox.toml
          --cargo-vendor false
          --transport-dir "${{ runner.temp }}/pixi-sandbox-transport"
          --log-dir "${{ runner.temp }}/pixi-sandbox-logs"
      - name: Upload publish diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-developer-diagnostics
          path: ${{ runner.temp }}/pixi-sandbox-logs
          if-no-files-found: ignore
          retention-days: 7
