[workspace]
name = "rude-clean-code"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.14"
lefthook = ">=2.2,<3"
bun = ">=1.4.2,<1.5"
convco = ">=0.7.2,<0.8"
actionlint = ">=1.7,<2"
shellcheck = ">=0.11,<1"
# Prose linter (see .vale.ini). From conda-forge, not a Bun-packaged
# binary: one less runtime between the locked workspace and the tool
# CI and hooks execute.
vale = ">=3,<4"

[pypi-dependencies]
# The build backend is locked so local projects can be installed without network.
hatchling = ">=1.27,<1.30"
# Repository structure policy linter (.alint.yml); PyPI-only distribution.
alint = ">=0.22,<1"
pytest = ">=8,<10"
pytest-bdd = ">=8,<10"
pytest-cov = ">=6,<8"
ruff = ">=0.11,<1"
mypy = ">=1.15,<2"
build = ">=1.2,<2"
twine = ">=6.2,<7"
pip-audit = ">=2.9,<3"
packaging = ">=26,<27"
tox = ">=4.67.13, <5"
doit = ">=0.37.0, <0.38"

# Pixi evaluates activation.env in the platform shell. Disable word splitting and
# globbing inside the substitution so checkout paths containing spaces are safe.
[activation.env]
PYTHONPATH = '$(IFS=; set -f; python ${PIXI_PROJECT_ROOT}/scripts/activate.py)'

[tasks]
# Unified automation runner; all check, test, build, hook, and release tasks live in dodo.py.
do = "doit"
bun-install = "bun install --frozen-lockfile"
# Direct Bun developer CLIs so arbitrary flags (for example `--help`) pass through untouched
# and Backlog.md skill instructions (`pixi run backlog ...`) keep working verbatim.
agents-md = { cmd = "bun x --bun --no-install agents-md", depends-on = ["bun-install"] }
backlog = { cmd = "bun x --bun --no-install backlog", depends-on = ["bun-install"] }
skills = { cmd = "bun x --bun --no-install skills", depends-on = ["bun-install"] }
