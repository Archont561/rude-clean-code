# Compatibility test matrix for the package at the repository root.
# Committed on purpose: the `Python compatibility` job in ci.yml runs
# `pixi run --locked tox -e pyXY` from this same configuration. Keep the
# envlist in sync with the versions the package supports (>= 3.11).
#
# tox does not install interpreters; it discovers them on PATH. Missing
# interpreters fail loudly by design (skip_missing_interpreters = false).
# For a partial local sweep you may override: -x testenv.skip_missing_interpreters=true
[tox]
envlist = py311, py312, py313
# The pyproject.toml at the repository root is the package manifest.
skip_missing_interpreters = false

[testenv]
description = Run the package BDD suite with pytest
# Without this, tox silently defaults to `package = skip`: the suite runs
# but never installs the distribution and fails with PackageNotFoundError.
package = sdist
deps =
    pytest
    pytest-bdd
commands =
    pytest tests
